<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="赴坡NTU">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EFF2EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1412">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>赴坡 NTU 工作台</title>
<style>
:root{
  --bg:#F2F1ED; --surface:#FBFAF7; --surface2:#F6F5F1; --sunk:#EAE8E2;
  --ink:#3B3B37; --ink2:#57574F; --muted:#8A887F; --faint:#A9A69C;
  --line:#E6E3DC; --line2:#D6D2C9;
  --accent:#9E5C55; --accent-soft:#F3E8E6;            /* 低饱和酒红，只做重点 */
  --grow:#7B8F7E; --grow-soft:#EAF0EA;                /* 莫兰迪绿 */
  --warn:#A8895C; --warn-soft:#F6EFE3;                /* 杏 */
  --blue:#7C8DA6; --blue-soft:#EAEEF4;
  --pink:#B18A92; --pink-soft:#F5EBEE;
  --purple:#8F86A6; --purple-soft:#EEEBF3;
  --hot:#B08A4A; --hot-soft:#FAF3E2;
  --blur:rgba(242,241,237,.86);
  --sh:0 1px 1px rgba(60,58,52,.03), 0 6px 18px -12px rgba(60,58,52,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181A19; --surface:#20221F; --surface2:#252723; --sunk:#2C2E29;
  --ink:#E4E2DC; --ink2:#C6C3BA; --muted:#94918A; --faint:#726F68;
  --line:#2E312C; --line2:#3C3F38;
  --accent:#C98980; --accent-soft:#2C211F;
  --grow:#9DB49F; --grow-soft:#1D241E;
  --warn:#C9A874; --warn-soft:#282218;
  --blue:#9FB0C7; --blue-soft:#1C2128;
  --pink:#CDA8B0; --pink-soft:#271E21;
  --purple:#ADA4C4; --purple-soft:#211F28;
  --hot:#CBA463; --hot-soft:#292217;
  --blur:rgba(24,26,25,.86);
  --sh:0 1px 1px rgba(0,0,0,.3), 0 6px 18px -12px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#181A19; --surface:#20221F; --surface2:#252723; --sunk:#2C2E29;
  --ink:#E4E2DC; --ink2:#C6C3BA; --muted:#94918A; --faint:#726F68;
  --line:#2E312C; --line2:#3C3F38;
  --accent:#C98980; --accent-soft:#2C211F;
  --grow:#9DB49F; --grow-soft:#1D241E;
  --warn:#C9A874; --warn-soft:#282218;
  --blue:#9FB0C7; --blue-soft:#1C2128;
  --pink:#CDA8B0; --pink-soft:#271E21;
  --purple:#ADA4C4; --purple-soft:#211F28;
  --hot:#CBA463; --hot-soft:#292217;
  --blur:rgba(24,26,25,.86);
  --sh:0 1px 1px rgba(0,0,0,.3), 0 6px 18px -12px rgba(0,0,0,.8);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  padding-bottom:calc(62px + env(safe-area-inset-bottom,0px)); overscroll-behavior-y:none}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; touch-action:manipulation; text-align:left}
input,select,textarea{font:inherit; color:inherit; font-size:16px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
.num{font-variant-numeric:tabular-nums}

.appbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--blur);
  backdrop-filter:saturate(180%) blur(18px); -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:.5px solid var(--line)}
.abar{height:50px; display:flex; align-items:center; gap:4px; padding:0 6px}
.abtn{min-width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:var(--accent); font-size:15px; padding:0 9px; white-space:nowrap}
.abtn:active{background:var(--sunk)}
.atitle{flex:1; text-align:center; font-size:17px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.spacer{min-width:44px}

.wrap{padding:16px 15px 26px}
.card{background:var(--surface); border:.5px solid var(--line); border-radius:18px; box-shadow:var(--sh)}
.sec{font-size:12px; letter-spacing:.08em; color:var(--faint); font-weight:600; margin:22px 2px 8px; text-transform:uppercase; display:flex; justify-content:space-between; align-items:baseline}
.sec b{font-weight:600; color:var(--muted); letter-spacing:0; text-transform:none; font-size:12px}
.bar{height:8px; border-radius:99px; background:var(--sunk); overflow:hidden}
.bar>i{display:block; height:100%; background:var(--grow); border-radius:99px; transition:width .3s}
.bar.sm{height:5px}
.bar.acc>i{background:var(--accent)}

.hero{padding:16px 16px 18px; margin-bottom:12px}
.hero-top{display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
.hero-lab{font-size:12px; letter-spacing:.08em; color:var(--faint); text-transform:uppercase}
.hero-d{font-size:40px; font-weight:700; line-height:1; letter-spacing:-.03em}
.hero-d small{font-size:17px; font-weight:500; color:var(--muted); letter-spacing:0; margin-left:4px}
.hero-date{font-size:13px; color:var(--muted); margin-top:6px}
.hero-date b{color:var(--accent); font-weight:500}
.hero-pct{text-align:right}
.hero-pct .v{font-size:27px; font-weight:700; color:var(--grow); letter-spacing:-.02em; line-height:1.1}
.hero-pct .s{font-size:12px; color:var(--muted)}
.hero .bar{margin-top:14px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stat{padding:11px 10px; border-radius:14px; background:var(--surface); border:.5px solid var(--line); min-width:0}
.stat .l{font-size:11px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stat .v{font-size:17px; font-weight:600; margin-top:2px; white-space:nowrap; letter-spacing:-.01em}
.stat .v small{font-size:12px; color:var(--muted); font-weight:400}

.today{padding:14px 15px; margin-bottom:12px; border-left:3px solid var(--accent)}
.today .h{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.today .t{font-size:15px; font-weight:600}
.today .d{font-size:12px; color:var(--faint)}
.today .l{font-size:13px; color:var(--muted); margin-top:7px; line-height:1.6}

.strip{display:flex; gap:8px; overflow-x:auto; padding:2px 14px 4px; margin:0 -14px; scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto; padding:9px 13px; border-radius:13px; background:var(--surface); border:.5px solid var(--line); min-width:94px}
.pchip:active{background:var(--sunk)}
.pchip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
.pchip .c{font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.05em}
.pchip .n{font-size:14px; font-weight:500; white-space:nowrap; margin-top:1px}
.pchip .d{font-size:11px; color:var(--faint); white-space:nowrap; margin-top:2px}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.cc{padding:15px 14px; border-radius:18px; background:var(--surface); border:.5px solid var(--line); min-height:94px; display:flex; flex-direction:column; justify-content:space-between}
.cc:active{background:var(--surface2)}
.cc .n{font-size:14.5px; font-weight:600; line-height:1.35; letter-spacing:-.01em; display:flex; align-items:flex-start; gap:8px}
.cc .ci{flex:0 0 auto; display:inline-flex; margin-top:1px}
.cc .ci svg{width:18px; height:18px; display:block}

.cc .m{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:8px}
.cc .k{font-size:11px; color:var(--accent); font-weight:600}
.cc .f{font-size:12px; color:var(--muted)}
.cc .bar{margin-top:7px}

/* ---- 日历 ---- */
.calhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
.calhead .m{font-size:19px; font-weight:700; letter-spacing:-.01em}
.calnav{display:flex; gap:6px}
.calnav button{width:40px; height:40px; border-radius:11px; background:var(--surface); border:.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--muted)}
.calnav button:active{background:var(--sunk)}
.calnav .t{width:auto; padding:0 13px; font-size:14px; color:var(--accent)}
.dow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px}
.dow span{text-align:center; font-size:11px; color:var(--faint); font-weight:600}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.day{aspect-ratio:1/1.18; border-radius:11px; background:var(--surface); border:.5px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:2px; min-width:0; position:relative}
.day:active{background:var(--sunk)}
.day.out{background:transparent; border-color:transparent}
.day.out .n{color:var(--faint); opacity:.5}
.day .n{font-size:14px; font-weight:500; line-height:1}
.day .cnt{font-size:9.5px; font-weight:700; line-height:1; padding:1.5px 4px; border-radius:99px; background:var(--grow-soft); color:var(--grow)}
.day .cnt.k{background:var(--accent-soft); color:var(--accent)}
.day .cnt.z{background:transparent; color:var(--faint); font-weight:400}
.day.today{border-color:var(--accent); border-width:1.5px}
.day.today .n{color:var(--accent); font-weight:700}
.day.sel{background:var(--ink)}
.day.sel .n{color:var(--bg)}
.day.sel .cnt{background:rgba(255,255,255,.22); color:#fff}
.day.dep::after{content:"✈"; position:absolute; top:1px; right:3px; font-size:8px; color:var(--accent)}
.daytitle{font-size:16px; font-weight:700; margin:20px 2px 4px; letter-spacing:-.01em}
.daysub{font-size:12.5px; color:var(--muted); margin:0 2px 10px}

/* ---- 条目行 ---- */
.list{background:var(--surface); border-radius:18px; border:.5px solid var(--line); overflow:hidden; box-shadow:var(--sh)}
.row{display:flex; flex-wrap:wrap; border-bottom:.5px solid var(--line); position:relative; transition:background .18s; overflow:hidden}
.row>.tog,.row>.acts,.row>.tags{transition:transform .22s cubic-bezier(.32,.72,0,1)}
.row.swiped>.tog,.row.swiped>.acts,.row.swiped>.tags{transform:translateX(-86px)}
.rowdel{position:absolute; right:0; top:0; bottom:0; width:86px; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:14.5px; font-weight:600;
  transform:translateX(100%); transition:transform .22s cubic-bezier(.32,.72,0,1); border-radius:0}
.row.swiped .rowdel{transform:translateX(0)}
.row.sel{background:var(--blue-soft)}
.bulkbar{position:sticky; top:calc(50px + env(safe-area-inset-top,0px)); z-index:30; background:var(--blur);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); margin:0 -15px 12px; padding:10px 15px;
  border-bottom:.5px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.bulkbar .n{font-size:13.5px; font-weight:600; flex:1; min-width:70px}
.bulkbar button{font-size:13px; padding:8px 12px; border-radius:99px; background:var(--surface); border:.5px solid var(--line2); white-space:nowrap}
.bulkbar button.pri{background:var(--grow); border-color:var(--grow); color:#fff; font-weight:600}
.bulkbar button.dg{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.bigtime{width:100%; text-align:left; padding:20px 18px; border-radius:18px; background:var(--surface);
  border:.5px solid var(--line); box-shadow:var(--sh); margin-bottom:14px}
.bigtime .k{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); font-weight:700}
.bigtime .v{font-size:23px; font-weight:700; letter-spacing:-.02em; margin-top:7px; display:flex; align-items:center; justify-content:space-between; gap:10px}
.bigtime .v small{font-size:13px; font-weight:500; color:var(--muted)}
.bigtime .d{font-size:12.5px; color:var(--muted); margin-top:6px}
.grp{background:var(--surface); border:.5px solid var(--line); border-radius:18px; box-shadow:var(--sh); margin-bottom:12px; overflow:hidden}
.grph{width:100%; display:flex; align-items:center; gap:10px; padding:18px 16px}
.grph:active{background:var(--surface2)}
.grph .gt{font-size:16px; font-weight:700; letter-spacing:-.01em; white-space:nowrap}
.grph .gs{flex:1; font-size:12px; color:var(--faint); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.grph .cv{color:var(--faint); font-size:11px; transition:transform .2s; flex:0 0 auto}
.grp.open .grph{border-bottom:.5px solid var(--line)}
.grp.open .grph .cv{transform:rotate(90deg)}
.pal{display:flex; gap:9px; flex-wrap:wrap}
.pc{width:44px; height:44px; border-radius:13px; border:1.5px solid; display:flex; align-items:center; justify-content:center}
.pc i{width:16px; height:16px; border-radius:99px; display:block; opacity:0; transition:opacity .15s}
.pc.on i{opacity:1}
.row:last-child{border-bottom:none}
.row::before{content:""; position:absolute; left:0; top:11px; bottom:11px; width:3px; border-radius:0 3px 3px 0; background:transparent}
.row::before{background:var(--cc, var(--line2))}
.row.key{background:var(--accent-soft)}
.row.top{background:var(--surface2)}
.row.key.top{background:var(--accent-soft)}
.tog{flex:1; min-width:0; display:flex; gap:13px; align-items:flex-start; padding:17px 4px 7px 15px; -webkit-user-select:none; user-select:none}
.tog:active{opacity:.6}
.box{flex:0 0 auto; width:24px; height:24px; border:1.5px solid var(--line2); border-radius:8px;
  display:flex; align-items:center; justify-content:center; color:transparent; font-size:14px; font-weight:700;
  background:var(--surface); transition:background .15s, border-color .15s}
.row.done .box{background:var(--grow); border-color:var(--grow); color:#fff}
.row.skip .box{background:var(--sunk); border-color:var(--line2); color:var(--faint)}
.rb{flex:1; min-width:0; padding-top:1px}
.rt{font-size:15.5px; line-height:1.45; font-weight:600; letter-spacing:-.01em; word-break:break-word; color:var(--ink)}
.row.done .rt{color:var(--muted); font-weight:500; text-decoration:line-through; text-decoration-color:var(--line2)}
.row.skip{opacity:.45}
.row.key .rt{color:var(--accent)}
.rt .pinb{font-style:normal; font-size:10px; color:var(--accent); background:var(--accent-soft);
  border:.5px solid var(--accent); border-radius:6px; padding:1px 5px; margin-right:7px; vertical-align:2px; font-weight:700}
.acts{flex:0 0 auto; display:flex; align-items:flex-start; padding:13px 8px 0 0; gap:1px}
.ic{width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--faint); border-radius:10px}
.ic svg{width:19px; height:19px; display:block}
.ic:active{background:var(--sunk)}
.ic.star.on,.ic.pin.on{color:var(--accent)}
.tags{width:100%; display:flex; gap:7px; flex-wrap:wrap; align-items:center; padding:2px 14px 15px 52px}
.tg{font-size:11.5px; line-height:1; padding:7px 11px; border-radius:99px; white-space:nowrap; font-weight:500;
  border:.5px solid var(--line); color:var(--faint); background:var(--surface2)}
.tg:active{opacity:.6}
.tg.lab{background:var(--sunk); border-color:transparent; color:var(--muted)}
.tg.dt{background:var(--blue-soft); border-color:transparent; color:var(--blue); font-weight:600}
.tg.bu.on{background:var(--warn-soft); border-color:transparent; color:var(--warn); font-weight:600}
.tg.cx.on{background:var(--grow-soft); border-color:transparent; color:var(--grow); font-weight:600}
.tg.mny,.tg.pay{border-color:transparent; background:var(--sunk); color:var(--ink2); font-weight:600}
.tg.pay{background:var(--grow-soft); color:var(--grow)}
.tg.hotn{background:var(--hot-soft); border-color:transparent; color:var(--hot); font-weight:600;
  max-width:100%; overflow:hidden; text-overflow:ellipsis}
.tg.link{background:var(--grow-soft); border-color:transparent; color:var(--grow); text-decoration:none;
  font-weight:600; display:inline-flex; align-items:center; gap:5px}
.tg.link svg{width:13px; height:13px}
.tg.lab.ico{padding:6px 8px; display:inline-flex; background:var(--sunk)}
.tg.lab.ico svg{width:14px; height:14px; display:block}
.tg.nf{background:transparent; border-color:var(--line2); color:var(--faint); padding:6px 8px; display:inline-flex}
.tg.nf svg{width:14px; height:14px; display:block}

.ghead{font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--faint); padding:20px 4px 9px;
  text-transform:uppercase; display:flex; justify-content:space-between; gap:8px; align-items:center}
.ghead span{color:var(--muted); font-weight:500; letter-spacing:0; text-transform:none}
.ghead .gi{display:inline-flex; align-items:center; gap:7px}
.ghead .gi svg{width:17px; height:17px}
.crow{display:flex; align-items:stretch; border-bottom:.5px solid var(--line)}
.crow:last-of-type{border-bottom:none}
.cbox{flex:0 0 auto; width:52px; display:flex; align-items:center; justify-content:center}
.chead{flex:1; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:17px 15px 17px 0}
.chead:active{background:var(--surface2)}
.chead .nm{display:inline-flex; align-items:center; gap:9px; font-size:15.5px; font-weight:600;
  letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chead .nm svg{width:18px; height:18px; flex:0 0 auto}
.chead .rr{flex:0 0 auto; display:flex; align-items:center; gap:10px}
.chead .ct{font-size:12.5px; color:var(--muted)}
.chead .cv{color:var(--faint); font-size:11px; transition:transform .2s}
.crow.open .cv{transform:rotate(90deg)}
.sublist{background:var(--surface2); border-bottom:.5px solid var(--line)}
.sublist .tog{padding-left:26px}
.cc{background:var(--ccs, var(--surface)); border-color:color-mix(in srgb, var(--cc,#999) 25%, transparent)}
.cc .ci{color:var(--cc, var(--muted))}
.cc .bar{background:color-mix(in srgb, var(--cc,#999) 16%, transparent)}
.cc .bar>i{background:var(--cc, var(--grow))}
.cc .f,.cc .k{color:color-mix(in srgb, var(--cc,#999) 72%, var(--ink))}
#printroot{display:none}
@media print{
  html,body{background:#fff!important}
  body>*{display:none!important}
  #printroot{display:block!important; padding:0; color:#000; font:11px/1.5 -apple-system,"PingFang SC",sans-serif}
  .ph1{font-size:19px; font-weight:700; margin-bottom:4px}
  .pmeta{font-size:10.5px; color:#555; margin-bottom:12px}
  table{border-collapse:collapse; width:100%}
  .psum{margin-bottom:18px}
  .psum th{font-size:9.5px; color:#555; text-align:left; font-weight:600; letter-spacing:.05em; border-bottom:1px solid #000; padding:3px 6px 3px 0}
  .psum td{font-size:13px; font-weight:700; padding:5px 6px 5px 0}
  .pcat{break-inside:avoid; page-break-inside:avoid; margin-bottom:15px}
  .pcat h2{font-size:13px; margin:0 0 5px; padding-bottom:3px; border-bottom:1.2px solid #000; font-weight:700}
  .pcat h2 span{float:right; font-size:10px; font-weight:400; color:#555}
  .pitems th{font-size:9px; color:#666; text-align:left; font-weight:600; padding:2px 5px 2px 0; border-bottom:.5px solid #bbb}
  .pitems td{padding:3px 5px 3px 0; border-bottom:.5px solid #e2e2e2; vertical-align:top; font-size:10.5px}
  .pbox{font-size:12px}
  .pdone td{color:#777; text-decoration:line-through}
  .pskip td{color:#aaa}
  .pn{font-size:9px; color:#666; margin-top:1px}
  .pfoot{margin-top:14px; font-size:9px; color:#666; border-top:.5px solid #ccc; padding-top:6px}
  @page{margin:13mm 11mm}
}
#pop{position:fixed; z-index:70; max-width:320px; background:var(--surface); color:var(--ink2);
  border:.5px solid var(--line2); border-radius:14px; padding:13px 15px; font-size:13px; line-height:1.65;
  box-shadow:0 10px 34px -12px rgba(60,58,52,.4); display:none}
#pop.on{display:block}

/* ---------- 自动排期：同一类尽量排在同一天 ---------- */
let AUTO={};
function buildAuto(){
  const dep=depart(), t0=today(); AUTO={};
  PHASES.forEach(p=>{
    let from = p.from<=-900 ? addD(dep,-75) : addD(dep,p.from);
    const to = addD(dep,p.to);
    if(from < t0) from = t0;                       /* 不往过去排 */
    let days = Math.round((to-from)/864e5)+1;
    if(days < 1) days = 1;                          /* 窗口已过 → 全压到今天 */
    const items = all().filter(i=>i.p===p.id);
    if(!items.length) return;
    const groups=[];
    cats().forEach(c=>{ const g=items.filter(i=>i.c===c.id); if(g.length) groups.push(g); });
    let acc=0;                                      /* 同一类一定同一天；按条目数加权铺开，避免某天挤爆 */
    groups.forEach(g=>{
      const off = Math.min(days-1, Math.floor(acc/items.length*days));
      const d = ymd(addD(from, Math.max(off,0)));
      g.forEach(it=>{ AUTO[it.id]=d; });
      acc += g.length;
    });
  });
}
const dateOf=it=>S.date[it.id]||AUTO[it.id]||ymd(depart());
/* 一键选日期的快捷项 */
/* 四个预设时间节点 → 对应日期，用于「快速绑定」 */
function TNODES(){
  const dep=depart(), t0=today();
  return [['t60','两个月前'],['t30','一个月前'],['t7','前一周'],['w1','落地后第一周']].map(x=>{
    const p=PH[x[0]];
    let d=p.from<=-900? addD(dep,-60) : addD(dep,p.from);
    if(d<t0) d=t0;
    return {n:x[1], v:ymd(d)};
  });
}
function QD(cur){
  const t=today(), dep=depart();
  const sat=addD(t,(6-t.getDay()+7)%7||6);
  let out=[['今天',ymd(t)],['明天',ymd(addD(t,1))],['本周末',ymd(sat)],
           ['下周一',ymd(addD(t,(8-t.getDay())%7||7))],
           ['出发前3天',ymd(addD(dep,-3))],['出发当天',ymd(dep)]];
  const seen={}; out=out.filter(x=>seen[x[1]]?false:(seen[x[1]]=1));   /* 撞同一天就去重 */
  return out.map(x=>({n:x[0], v:x[1], on:(x[1]===cur)}));
}
function onDay(d){ return all().filter(it=>dateOf(it)===d); }

/* ---------- 预算 ---------- */
/* 预估 = 买之前填的；实付 = 买完填的。已买但没填实付，就按预估算 */
function money(list){
  const r=Number(S.settings.rate)||5.4;
  const toC=(v,cu)=>cu==='CNY'?v:v*r;
  let plan=0, spent=0, left=0, nPlan=0, nSpent=0;
  (list||all()).forEach(it=>{
    if(mark(it.id)==='skip') return;
    const c=costOf(it), pd=paidOf(it);
    const cv = c.a? toC(c.a,c.cu) : 0;
    const pv = (pd&&pd.a)? toC(pd.a,pd.cu) : 0;
    if(cv) nPlan++;
    if(mark(it.id)==='done'){ const v = pv||cv; spent+=v; if(pv) nSpent++; }
    else { left += cv; }
    plan += (mark(it.id)==='done' ? (pv||cv) : cv);
  });
  return {plan:plan, spent:spent, left:left, rate:r, nPlan:nPlan, nSpent:nSpent};
}

      +'<div class="d">这一段共 '+st.act+' 件，还剩 '+todo.length+' 件没做</div>'
      +'<div class="bar" style="margin-top:12px"><i style="width:'+st.pct+'%"></i></div></button>';

    h+= show.length? '<div class="ghead">还没做 <span>'+show.length+' 件</span></div><div class="list">'
        +show.map(it=>rowHTML(it,{cat:true,nophase:true,date:true})).join('')+'</div>'

let BULK={};
/* 只重画结果区，输入框不动 —— 中文输入法不会被打断 */
function searchResults(q){
  q=(q||'').trim();
  if(!q) return '<div class="empty">搜事项、说明、我的备注都行。<br>中英文都可以，边打边出结果。</div>';
  const k=q.toLowerCase();
  const r=all().filter(it=>(it.t+' '+(it.n||'')+' '+myNote(it)+' '+(CATN[it.c]||'')).toLowerCase().includes(k));
  return r.length
    ? '<div class="ghead">'+r.length+' 条结果</div><div class="list">'+sortL(r).map(it=>rowHTML(it,{cat:true,date:true})).join('')+'</div>'
    : '<div class="empty">没找到「'+esc(q)+'」<br>换个词，或者点右上角 ＋ 把它加进来。</div>';
}

   +'<div class="num" style="font-size:12px; color:var(--faint); margin-top:7px">'+s.done+' / '+s.act+' 已完成</div></div>'
   ;

/* 只重画当前视图，保持滚动位置 */
function reRender(){
  const y=window.scrollY, app=$('#app');
  if(V.v==='cal'){ app.innerHTML=vCal(); setTimeout(bindCal,0); }
  else if(V.v==='cat') app.innerHTML=vCat();
  else if(V.v==='list'){ app.innerHTML=vList(); bindSearch(); }
  else render();
  window.scrollTo(0,y);
}
function render(){
  syncCatN(); buildAuto();
  const app=$('#app'), ab=$('#abar');
  let title='', left='', right='<button class="abtn" data-act="add">＋</button>';
  if(V.v==='home'){ title='赴坡 · NTU'; app.innerHTML=vHome(); }
  else if(V.v==='cal'){ title='日历'; app.innerHTML=vCal(); setTimeout(bindCal,0); }
  else if(V.v==='list'){ title='清单';
    right = (V.m||'cat')==='cat' ? '<button class="abtn" data-act="addcat">＋ 大类</button>'
                                 : '<button class="abtn" data-act="add">＋</button>';
    app.innerHTML=vList(); }
  else if(V.v==='cat'){ title=CATN[V.c]||''; left='<button class="abtn" data-act="back">‹ 返回</button>'; app.innerHTML=vCat(); }
  else { title='更多'; right=''; app.innerHTML=vMore(); }
  ab.innerHTML=(left||'<span class="spacer"></span>')+'<div class="atitle">'+esc(title)+'</div>'+(right||'<span class="spacer"></span>');
  document.querySelectorAll('.tab').forEach(t=>{
    const on=(t.dataset.go===V.v)||(V.v==='cat'&&t.dataset.go==='list');
    on? t.setAttribute('aria-current','page') : t.removeAttribute('aria-current'); });
  bindSearch();
}
function bindSearch(){
  const q=$('#q'), res=$('#sres'), x=$('#qx'); if(!q||!res) return;
  let composing=false;
  const run=()=>{ V.q=q.value; res.innerHTML=searchResults(V.q); if(x) x.hidden=!q.value; };
  q.addEventListener('compositionstart',()=>{ composing=true; });
  q.addEventListener('compositionend',()=>{ composing=false; run(); });   /* 拼音选完字才筛 */
  q.addEventListener('input',()=>{ if(!composing) run(); });
  if(x) x.addEventListener('click',()=>{ V.q=''; V.m='cat'; render(); });   /* 清空回到分类页 */
}

/* 把清单里的事项批量挪到某一天：第一层只给大类，点开才是明细 */
let PICK={}, PICKEX={}, PICKDAY='';
function pickSheet(day){

function renderPick(){
  const d=parseD(PICKDAY);

  let n=0; for(const k in PICK){ if(PICK[k]) n++; }

   +'<div class="sh-n" style="margin-bottom:12px">先点大类，整类一次选完；想挑单项就展开。选好按底下的按钮。</div>'
   +'<div class="list">';
  cats().forEach(c=>{
    const g=pool.filter(i=>i.c===c.id); if(!g.length) return;
    const sel=g.filter(i=>PICK[i.id]).length, allSel=sel===g.length, op=!!PICKEX[c.id];
    h+='<div class="crow'+(op?' open':'')+'">'
      +'<button class="cbox" data-pall="'+c.id+'"><span class="box" style="'+(allSel?'background:var(--grow);border-color:var(--grow);color:#fff':(sel?'background:var(--grow-soft);border-color:var(--grow);color:var(--grow)':''))+'">'+(allSel?'✓':(sel?'–':'✓'))+'</span></button>'
      +'<button class="chead" data-pcat="'+c.id+'"><span class="nm"><span style="color:'+catCol(c.id)[0]+'; display:inline-flex">'+catIcon(c.id)+'</span>'+esc(c.n)+'</span>'
      +'<span class="rr"><span class="ct num">'+(sel?sel+' / ':'')+g.length+'</span><span class="cv">▶</span></span></button></div>';
    if(op){
      h+='<div class="sublist">';
      g.forEach(it=>{ const on=!!PICK[it.id];
        h+='<div class="row"><button class="tog" data-pitem="'+it.id+'" style="padding-left:24px">'
          +'<span class="box" style="'+(on?'background:var(--grow);border-color:var(--grow);color:#fff':'')+'">✓</span>'

          +'<span class="chips"><span class="chip date">现在 '+fmtMD(parseD(dateOf(it)))+'</span></span></span></button></div>';
      });

    }

async function saveFile(name, data, mime){
  try{ const dl = await (window.claude&&window.claude.use? window.claude.use('downloads') : null);
    if(dl){ await dl.save({filename:name, data:data}); toast('已保存'); return; } }catch(e){ if(e&&e.code==='declined') return; }
  try{ const b=new Blob([data],{type:mime}), u=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000); toast('已导出'); }
  catch(e){ openSheet('<div class="sh-t">手动复制备份</div><div class="sh-n">这个环境不能直接下载文件。长按下面的文字全选复制，存到备忘录里。</div>'
    +'<textarea class="fld" style="min-height:220px; font-size:11px" readonly>'+esc(data)+'</textarea><button class="btn g" data-act="close">关闭</button>'); }
}

  cats().forEach(c=>{

      +(cm.plan?' · 预算 ≈¥'+cny(cm.plan):'')+'</span></h2>'
      +'<table class="pitems"><colgroup><col style="width:26px"><col><col style="width:52px"><col style="width:74px"><col style="width:74px"></colgroup>'
      +'<tr><th></th><th>事项</th><th>日期</th><th>标记</th><th>金额</th></tr>';
    l.forEach(it=>{
      const m=mark(it.id), c2=costOf(it), pd=paidOf(it);

      const mny= pd&&pd.a? '实付'+(pd.cu==='CNY'?'¥':'S$')+pd.a : (c2.a? (c2.cu==='CNY'?'¥':'S$')+c2.a : '');
      h+='<tr class="'+(m==='done'?'pdone':(m==='skip'?'pskip':''))+'">'
        +'<td class="pbox">'+(m==='done'?'☑':(m==='skip'?'⊘':'☐'))+'</td>'
        +'<td>'+esc(it.t)+(myNote(it)?'<div class="pn">'+esc(myNote(it))+'</div>':'')+'</td>'
        +'<td>'+fmtMD(parseD(dateOf(it)))+'</td><td>'+tagz+'</td><td>'+mny+'</td></tr>';
    });

  return h;

function csvText(){

const POP=document.createElement('div'); POP.id='pop'; document.body.appendChild(POP);

function popFor(id, anchor){

/* ---------- 手势 ---------- */
let SW=null;                                   /* 当前被左滑打开的行 */
function unswipe(){ if(SW){ SW.classList.remove('swiped'); SW=null; } }
(function(){
  let x0=0,y0=0,row=null,lock='';
  document.addEventListener('touchstart', e=>{
    const t=e.touches[0]; x0=t.clientX; y0=t.clientY; lock='';
    row=e.target.closest('[data-row]');
    if(SW && SW!==row) unswipe();
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(!row) return;
    const t=e.touches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(!lock){ if(Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.6) lock='x'; else if(Math.abs(dy)>10) lock='y'; }
    if(lock!=='x') return;
    if(dx<-40){ if(SW&&SW!==row) unswipe(); row.classList.add('swiped'); SW=row; }
    else if(dx>40){ row.classList.remove('swiped'); if(SW===row) SW=null; }
  }, {passive:true});
  document.addEventListener('touchend', ()=>{ row=null; lock=''; }, {passive:true});
})();
/* 日历横滑翻月 */
function calSwipe(el){
  let x0=0,y0=0,on=false;
  el.addEventListener('touchstart', e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; on=true; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(!on) return; on=false;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.4) shiftMonth(dx<0?1:-1);
  }, {passive:true});
}
function shiftMonth(n){
  const sel=parseD(V.day||ymd(today()));
  let y=V.y!==undefined?V.y:sel.getFullYear(), mo=V.mo!==undefined?V.mo:sel.getMonth();
  mo+=n; if(mo<0){mo=11;y--;} if(mo>11){mo=0;y++;}
  V.y=y; V.mo=mo; const p=window.scrollY; $('#app').innerHTML=vCal(); bindCal(); window.scrollTo(0,p);
}
function bindCal(){ const g=$('#app .cal'); if(g) calSwipe(g); }
/* 弹层下拉关闭 */
(function(){
  const sh=$('#sheet'); let y0=0, dragging=false, dy=0;
  sh.addEventListener('touchstart', e=>{
    const onGrab = e.target.closest('.grab, .sh-t');     /* 抓手和标题：随时可拖 */
    if(sh.scrollTop>0 && !onGrab){ dragging=false; return; }
    y0=e.touches[0].clientY; dragging=true; dy=0; sh.style.transition='none';
  }, {passive:true});
  sh.addEventListener('touchmove', e=>{
    if(!dragging) return;
    dy=e.touches[0].clientY-y0;
    if(dy<0){ dy=0; return; }
    sh.style.transform='translateY('+dy+'px)';
    $('#mask').style.opacity=String(Math.max(0, 1-dy/420));
  }, {passive:true});
  sh.addEventListener('touchend', ()=>{
    if(!dragging) return; dragging=false;
    sh.style.transition=''; $('#mask').style.opacity='';
    if(dy>90){ sh.style.transform=''; closeSheet(); } else { sh.style.transform='translateY(0)'; }
  }, {passive:true});
})();

      const n=Number(v); if(n>0){ S.settings.rate=n; save(); render(); toast('已更新'); } break; }
    case 'reseed': { const n=Object.keys(S.date).length;
      if(!confirm('清掉你手动改过的 '+n+' 个日期，全部按阶段重新铺一遍？')) break;
      S.date={}; save(); render(); toast('已重排'); break; }
    case 'dsave': { const id=d.id;
      const a=Number($('#d-a').value)||0, u=$('#d-u').value;
      const pa=Number($('#d-pa').value)||0, pu=$('#d-pu').value;
      const nv=$('#d-n').value.trim();
      if(nv) S.note[id]=nv; else { delete S.note[id]; delete S.hot[id]; }
      if(a) S.cost[id]={a:a,cu:u}; else delete S.cost[id];
      if(pa) S.paid[id]={a:pa,cu:pu}; else delete S.paid[id];
      save(); closeSheet(); render(); toast('已保存'); break; }
    case 'ddel': { const id=d.id; if(!confirm('删掉这一条？')) break;
      S.custom=(S.custom||[]).filter(x=>x.id!==id);
      ['mark','note','cost','paid','date','shop','buy','key','ch','top','hot','del'].forEach(k=>delete S[k][id]);
      save(); closeSheet(); render(); toast('已删除'); break; }
    case 'catsave': {
      const n=$('#nc-n').value.trim(); if(!n){ $('#nc-n').focus(); toast('先起个名'); break; }
      const pi=Number(($('#nc-p').querySelector('.pc.on')||{}).dataset?.pc||0);
      const col=PALETTE[pi]||PALETTE[0];
      const id='c'+Date.now().toString(36);
      S.cats.push({id:id, n:n, d:$('#nc-d').value.trim(), col:col[0], soft:col[1]});
      save(); syncCatN(); closeSheet(); go({v:'cat', c:id, todo:false}); toast('大类「'+n+'」建好了'); break; }
    case 'asave': { const v=$('#a-t').value.trim(); if(!v){ $('#a-t').focus(); break; }
      const id='u'+Date.now().toString(36);
      const it={id:id, c:$('#a-c').value, t:v, n:'', p:'t30', k:0, b:'', a:0, cu:'SGD', own:1};
      const a=Number($('#a-a').value)||0, dd=$('#a-d').value;
      S.custom.push(it);
      if(dd) S.date[id]=dd;
      const ab=$('#a-buy').querySelector('[data-abuy][aria-pressed="true"]');
      S.buy[id]= ab? ab.dataset.abuy : 'no';
      const ac=$('#a-ch').querySelector('[data-ach][aria-pressed="true"]');
      if(ac && ac.dataset.ach) S.ch[id]=ac.dataset.ach;
      if(a) S.cost[id]={a:a, cu:$('#a-u').value};
      save(); closeSheet(); render(); toast('已加到「'+CATN[it.c]+'」'); break; }
    case 'backup': saveFile('NTU-backup-'+ymd(new Date())+'.json', JSON.stringify(S,null,1), 'application/json'); break;
    case 'pdf': exportPDF(); break;
    case 'csv': saveFile('NTU-'+ymd(new Date())+'.csv', csvText(), 'text/csv;charset=utf-8'); break;
    case 'dateok': { const v=$('#d-d').value; if(v) S.date[d.id]=v; save(); closeSheet(); render(); toast('日期已改'); break; }
    case 'dateauto': { delete S.date[d.id]; save(); closeSheet(); render(); toast('已恢复自动排期'); break; }
    case 'restore': $('#rf').click(); break;
  }
});
document.addEventListener('change', e=>{
  if(e.target.id!=='rf') return;
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d||typeof d!=='object') throw 0;
      if(!confirm('会用备份覆盖当前进度，确定？')) return;
      S=Object.assign(JSON.parse(JSON.stringify(DEF)), d);
      ['mark','note','cost','paid','date','shop','buy','key','ch','top','hot','del'].forEach(k=>{ if(!S[k]) S[k]={}; });
      if(!S.custom) S.custom=[];
      if(!S.settings) S.settings={depart:'2026-11-01',rate:5.4};
      save(); render(); toast('已恢复'); }
    catch(err){ toast('读不出来，要选之前导出的 .json'); } };
  fr.readAsText(f); e.target.value='';
});

load(); go({v:'home'}, true);
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
