<style>
:root{
  --bg:#EFF2EE; --surface:#FFFFFF; --surface2:#F6F9F5; --sunk:#E3E9E1;
  --ink:#18211C; --ink2:#37453D; --muted:#5C6A62; --faint:#8B978F;
  --line:#D6DED5; --line2:#C3CDC2;
  --accent:#C0432A; --accent-soft:#FBEDE9;
  --grow:#0E6E58; --grow-soft:#E1EFE9;
  --warn:#9A6B06; --warn-soft:#F7EED9;
  --blur:rgba(239,242,238,.82);
  --sh:0 1px 2px rgba(24,33,28,.06), 0 10px 30px -18px rgba(24,33,28,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1A; --surface2:#1C2521; --sunk:#222C27;
  --ink:#E7EDE8; --ink2:#C6D1C9; --muted:#93A199; --faint:#6E7C74;
  --line:#293430; --line2:#3A463F;
  --accent:#FF7D55; --accent-soft:#2A1A14;
  --grow:#4CC5A1; --grow-soft:#11251F;
  --warn:#D9A441; --warn-soft:#241C0D;
  --blur:rgba(15,20,18,.82);
  --sh:0 1px 2px rgba(0,0,0,.45), 0 10px 30px -18px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1A; --surface2:#1C2521; --sunk:#222C27;
  --ink:#E7EDE8; --ink2:#C6D1C9; --muted:#93A199; --faint:#6E7C74;
  --line:#293430; --line2:#3A463F;
  --accent:#FF7D55; --accent-soft:#2A1A14;
  --grow:#4CC5A1; --grow-soft:#11251F;
  --warn:#D9A441; --warn-soft:#241C0D;
  --blur:rgba(15,20,18,.82);
  --sh:0 1px 2px rgba(0,0,0,.45), 0 10px 30px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));
  overscroll-behavior-y:none;
}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; touch-action:manipulation; text-align:left}
input,select,textarea{font:inherit; color:inherit}
input,textarea{font-size:16px}           /* <16px 会让 iOS 自动放大 */
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
.num{font-variant-numeric:tabular-nums}

/* ---------- 顶栏 ---------- */
.appbar{
  position:sticky; top:0; z-index:40;
  background:var(--blur); backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  padding-top:env(safe-area-inset-top,0px);
  border-bottom:.5px solid var(--line);
}
.abar{height:50px; display:flex; align-items:center; gap:4px; padding:0 6px}
.abtn{min-width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:var(--accent); font-size:15px; padding:0 8px}
.abtn:active{background:var(--sunk)}
.atitle{flex:1; text-align:center; font-size:17px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px}
.abar .spacer{min-width:44px}

/* ---------- 通用 ---------- */
.wrap{padding:14px 14px 20px}
.card{background:var(--surface); border:.5px solid var(--line); border-radius:16px; box-shadow:var(--sh)}
.sec{font-size:12px; letter-spacing:.08em; color:var(--faint); font-weight:600; margin:22px 2px 8px; text-transform:uppercase}
.bar{height:8px; border-radius:99px; background:var(--sunk); overflow:hidden}
.bar>i{display:block; height:100%; background:var(--grow); border-radius:99px; transition:width .3s ease}
.bar.sm{height:5px}
.bar.acc>i{background:var(--accent)}

/* ---------- 首页 hero ---------- */
.hero{padding:16px 16px 18px; margin-bottom:14px}
.hero-top{display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
.hero-lab{font-size:12px; letter-spacing:.08em; color:var(--faint); text-transform:uppercase}
.hero-d{font-size:40px; font-weight:700; line-height:1; letter-spacing:-.03em}
.hero-d small{font-size:17px; font-weight:500; color:var(--muted); letter-spacing:0; margin-left:4px}
.hero-date{font-size:13px; color:var(--muted); margin-top:6px}
.hero-date b{color:var(--accent); font-weight:500}
.hero-pct{text-align:right}
.hero-pct .v{font-size:27px; font-weight:700; letter-spacing:-.02em; color:var(--grow); line-height:1.1}
.hero-pct .s{font-size:12px; color:var(--muted)}
.hero .bar{margin-top:14px}

.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:4px}
.stat{padding:11px 10px; border-radius:14px; background:var(--surface); border:.5px solid var(--line); min-width:0}
.stat .l{font-size:11px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stat .v{font-size:17px; font-weight:600; letter-spacing:-.01em; margin-top:2px; white-space:nowrap}
.stat .v small{font-size:12px; color:var(--muted); font-weight:400}

/* ---------- 阶段条 ---------- */
.strip{display:flex; gap:8px; overflow-x:auto; padding:2px 14px 4px; margin:0 -14px; scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto; padding:9px 13px; border-radius:13px; background:var(--surface); border:.5px solid var(--line); min-width:96px}
.pchip:active{background:var(--sunk)}
.pchip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
.pchip .c{font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.05em}
.pchip .n{font-size:14px; font-weight:500; white-space:nowrap; margin-top:1px}
.pchip .d{font-size:11px; color:var(--faint); white-space:nowrap; margin-top:2px}

/* ---------- 分类格 ---------- */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.cc{padding:13px 13px 12px; border-radius:16px; background:var(--surface); border:.5px solid var(--line); min-height:96px; display:flex; flex-direction:column; justify-content:space-between}
.cc:active{background:var(--surface2); transform:scale(.985)}
.cc .n{font-size:15px; font-weight:600; line-height:1.3; letter-spacing:-.01em}
.cc .m{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:8px}
.cc .k{font-size:11px; color:var(--accent); font-weight:600}
.cc .f{font-size:12px; color:var(--muted)}
.cc .bar{margin-top:7px}
.cc.done .n{color:var(--muted)}

/* ---------- 条目行 ---------- */
.list{background:var(--surface); border-radius:16px; border:.5px solid var(--line); overflow:hidden; box-shadow:var(--sh)}
.row{display:flex; align-items:stretch; border-bottom:.5px solid var(--line); position:relative}
.row:last-child{border-bottom:none}
.row::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent}
.row.key::before{background:var(--accent)}
.tog{flex:1; min-width:0; display:flex; gap:12px; align-items:flex-start; padding:14px 6px 14px 13px; -webkit-user-select:none; user-select:none}
.tog:active{background:var(--surface2)}
.box{flex:0 0 auto; width:26px; height:26px; margin-top:1px; border:2px solid var(--line2); border-radius:8px; display:flex; align-items:center; justify-content:center; color:transparent; font-size:15px; font-weight:700; transition:background .15s, border-color .15s}
.row.done .box{background:var(--grow); border-color:var(--grow); color:#fff}
.row.skip .box{background:var(--sunk); border-color:var(--line2); color:var(--faint)}
.rb{flex:1; min-width:0}
.rt{font-size:15.5px; line-height:1.42; letter-spacing:-.01em; word-break:break-word}
.row.done .rt{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line2)}
.row.skip{opacity:.5}
.rn{font-size:12.5px; line-height:1.45; color:var(--muted); margin-top:3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.chips{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px}
.chip{font-size:10.5px; line-height:1.6; padding:1px 7px; border-radius:6px; white-space:nowrap; font-weight:500}
.chip.p{background:var(--sunk); color:var(--muted)}
.chip.key{background:var(--accent-soft); color:var(--accent)}
.chip.cn{background:var(--warn-soft); color:var(--warn)}
.chip.sg{background:var(--grow-soft); color:var(--grow)}
.chip.money{background:var(--sunk); color:var(--ink2); font-weight:600}
.chip.mine{border:.5px solid var(--line2); color:var(--faint)}
.chip.cat{background:var(--sunk); color:var(--muted)}
.more{flex:0 0 auto; width:46px; display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:19px; letter-spacing:1px}
.more:active{background:var(--surface2)}
.ghead{font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--faint); padding:18px 4px 8px; text-transform:uppercase}
.ghead span{color:var(--muted); font-weight:500; letter-spacing:0; text-transform:none}

/* ---------- 工具行 ---------- */
.tools{display:flex; gap:8px; align-items:center; margin-bottom:12px}
.switch{flex:1; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 14px; border-radius:13px; background:var(--surface); border:.5px solid var(--line); font-size:14px}
.sw{flex:0 0 auto; width:48px; height:29px; border-radius:99px; background:var(--sunk); position:relative; transition:background .2s}
.sw i{position:absolute; top:2.5px; left:2.5px; width:24px; height:24px; border-radius:99px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s}
.switch[aria-pressed="true"] .sw{background:var(--grow)}
.switch[aria-pressed="true"] .sw i{transform:translateX(19px)}

/* ---------- 搜索 ---------- */
.sbox{display:flex; align-items:center; gap:8px; background:var(--surface); border:.5px solid var(--line); border-radius:13px; padding:0 13px; margin-bottom:14px}
.sbox input{flex:1; min-width:0; border:none; background:none; outline:none; padding:13px 0}
.sbox .x{width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--faint); margin-right:-8px}

/* ---------- 底部 tab ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:flex; background:var(--blur); backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:.5px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab{flex:1; height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--faint); font-size:10.5px; letter-spacing:.02em}
.tab .i{font-size:19px; line-height:1}
.tab[aria-current="page"]{color:var(--accent)}
.tab:active{opacity:.55}
.tab .badge{position:absolute; transform:translate(15px,-11px); background:var(--accent); color:#fff; font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:99px; min-width:17px; text-align:center}

/* ---------- 弹层 ---------- */
.mask{position:fixed; inset:0; z-index:60; background:rgba(10,16,13,.45); opacity:0; transition:opacity .22s}
.mask.on{opacity:1}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61;
  background:var(--surface); border-radius:22px 22px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:86vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  transform:translateY(100%); transition:transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 40px -12px rgba(0,0,0,.4);
}
.sheet.on{transform:translateY(0)}
.grab{width:38px; height:5px; border-radius:99px; background:var(--line2); margin:6px auto 14px}
.sh-t{font-size:18px; font-weight:600; line-height:1.35; letter-spacing:-.01em; margin-bottom:8px}
.sh-n{font-size:13.5px; line-height:1.6; color:var(--muted); background:var(--surface2); border-radius:12px; padding:11px 13px; margin-bottom:16px}
.fl{font-size:12px; letter-spacing:.06em; color:var(--faint); font-weight:600; margin:16px 0 7px; text-transform:uppercase}
.seg3{display:flex; gap:6px; background:var(--sunk); padding:4px; border-radius:13px}
.seg3 button{flex:1; padding:10px 6px; border-radius:10px; text-align:center; font-size:14px; color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fld{width:100%; background:var(--surface2); border:.5px solid var(--line); border-radius:12px; padding:12px 13px; outline:none; -webkit-appearance:none}
.fld:focus{border-color:var(--accent)}
textarea.fld{resize:none; min-height:74px; line-height:1.5}
.two{display:flex; gap:8px}
.two .fld{min-width:0}
.two .fld.a{flex:2}
.two .fld.b{flex:1}
.btn{display:block; width:100%; text-align:center; padding:15px; border-radius:14px; background:var(--ink); color:var(--bg); font-size:16px; font-weight:600; margin-top:18px}
.btn:active{opacity:.8}
.btn.g{background:var(--surface2); color:var(--ink); border:.5px solid var(--line); margin-top:9px}
.btn.d{background:none; color:var(--accent); margin-top:6px}

/* ---------- 其他 ---------- */
.toast{position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:14px; z-index:80;
  box-shadow:var(--sh); max-width:88vw; text-align:center}
.empty{padding:44px 20px; text-align:center; color:var(--faint); font-size:14px; line-height:1.7}
.warn{background:var(--warn-soft); border:.5px solid color-mix(in srgb, var(--warn) 35%, transparent);
  border-radius:13px; padding:11px 13px; font-size:13px; line-height:1.55; color:var(--ink2); margin-bottom:14px}
.about{font-size:12.5px; line-height:1.75; color:var(--muted)}
.about h4{font-size:13px; color:var(--ink2); margin:18px 0 6px; font-weight:700}
.about ul{margin:0; padding-left:17px}
.about li{margin-bottom:5px}
.about a{color:var(--grow)}
.pop{animation:pop .25s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
</style>
</head>
<body>

<div class="appbar"><div class="abar" id="abar"></div></div>
<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-go="home"><span class="i">◎</span>总览</button>
  <button class="tab" data-go="todo"><span class="i">☑</span>待办</button>
  <button class="tab" data-go="search"><span class="i">⌕</span>搜索</button>
  <button class="tab" data-go="more"><span class="i">⋯</span>更多</button>
</nav>

<div class="mask" id="mask" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<script>

const CITE=/(小红书 @[^（）]*?2026-09|NTU 官网，2026-09-17|ICA 官网，2026-09-17)/g;
function preview(t){
  if(!t) return '';
  var out = t.replace(CITE,'')
          .replace(/（\s*[，、；]*\s*）/g,'')
          .replace(/^[（(：:，,、；;\s]+/,'')
          .replace(/[，,、；;\s（(]+$/,'')
          .replace(/\s{2,}/g,' ')
          .trim();
  /* 去掉出处后只剩「的做法」「列了」这种残渣，就别显示了 */
  if(out !== t && out.length < 10) return '';
  return out;
}
function costOf(it){ const o=S.cost[it.id]; return (o&&typeof o.a==='number')?{a:o.a,cu:o.cu||'SGD'}:{a:it.a||0,cu:it.cu||'SGD'}; }
function depart(){ const d=new Date(S.settings.depart+'T00:00:00'); return isNaN(d)?new Date('2026-11-01T00:00:00'):d; }
function addD(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
const fmtMD=d=>(d.getMonth()+1)+'/'+d.getDate();
function daysLeft(){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((depart()-t)/864e5); }
function stats(list){ let done=0,act=0; list.forEach(it=>{const m=mark(it.id); if(m==='skip')return; act++; if(m==='done')done++;});
  return {done,act,pct:act?Math.round(done/act*100):0}; }
function budget(){ let s=0,c=0; all().forEach(it=>{ if(mark(it.id)==='skip')return; const x=costOf(it); if(!x.a)return;
  if(x.cu==='CNY')c+=x.a; else s+=x.a; }); const r=Number(S.settings.rate)||5.4; return {sgd:s,cny:c,total:s*r+c,rate:r}; }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }

/* ===================== 路由 ===================== */
let V={v:'home'};
function go(state,replace){
  V=state;
  try{ history[replace?'replaceState':'pushState'](state,''); }catch(e){}
  render(); window.scrollTo(0,0);
}
window.addEventListener('popstate', e=>{ V=e.state||{v:'home'}; render(); });

/* ===================== 行渲染 ===================== */
function rowHTML(it,opts){
  opts=opts||{};
  const m=mark(it.id), p=PH[it.p], c=costOf(it), nt=preview(noteOf(it));
  return '<div class="row'+(it.k?' key':'')+(m==='done'?' done':'')+(m==='skip'?' skip':'')+'" id="r-'+it.id+'">'
    +'<button class="tog" data-tog="'+it.id+'">'
      +'<span class="box">'+(m==='skip'?'—':'✓')+'</span>'
      +'<span class="rb">'
        +'<span class="rt">'+esc(it.t)+'</span>'
        +(nt?'<span class="rn">'+esc(nt)+'</span>':'')
        +'<span class="chips">'
          +(opts.cat?'<span class="chip cat">'+esc(CATN[it.c]||'')+'</span>':'')
          +(p&&!opts.nophase?'<span class="chip p">'+p.code+'</span>':'')
          +(it.k?'<span class="chip key">关键</span>':'')
          +(it.b==='cn'?'<span class="chip cn">国内带</span>':'')
          +(it.b==='sg'?'<span class="chip sg">落地买</span>':'')
          +(it.own?'<span class="chip mine">我加的</span>':'')
          +(c.a?'<span class="chip money">'+(c.cu==='CNY'?'¥':'S$')+c.a+'</span>':'')
        +'</span>'
      +'</span>'
    +'</button>'
    +'<button class="more" data-more="'+it.id+'" aria-label="详情">⋯</button>'
  +'</div>';
}
/* 只更新一行，不整页重画 —— 连点几十下也不卡 */
function refreshRow(id){
  const el=document.getElementById('r-'+id); if(!el) return;
  const m=mark(id);
  el.classList.toggle('done', m==='done');
  el.classList.toggle('skip', m==='skip');
  const b=el.querySelector('.box'); b.textContent = m==='skip'?'—':'✓';
  b.classList.remove('pop'); void b.offsetWidth; if(m==='done') b.classList.add('pop');
}

    const n=all().filter(i=>i.p===p.id&&mark(i.id)==='todo').length;
    h+='<button class="pchip" data-tph="'+p.id+'" aria-pressed="'+(phase===p.id?'true':'false')+'">'

/* ===================== 渲染 ===================== */
function render(){
  const app=$('#app'), ab=$('#abar');
  let title='', left='', right='';
  if(V.v==='home'){ title='赴坡 · NTU'; right='<button class="abtn" data-act="add">＋</button>'; app.innerHTML=viewHome(); }
  else if(V.v==='cat'){ title=CATN[V.c]||''; left='<button class="abtn" data-act="back">‹ 返回</button>';
    right='<button class="abtn" data-act="add">＋</button>'; app.innerHTML=viewCat(V.c, !!V.todo); }
  else if(V.v==='todo'){ title='待办'; right='<button class="abtn" data-act="add">＋</button>'; app.innerHTML=viewTodo(V.p||''); }
  else if(V.v==='search'){ title='搜索'; app.innerHTML=viewSearch(V.q||''); }
  else { title='更多'; app.innerHTML=viewMore(); }
  ab.innerHTML=(left||'<span class="spacer"></span>')+'<div class="atitle">'+esc(title)+'</div>'+(right||'<span class="spacer"></span>');
  document.querySelectorAll('.tab').forEach(t=>{
    const on=(t.dataset.go===V.v)||(V.v==='cat'&&t.dataset.go==='home');
    if(on) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current');
  });
  const q=$('#q');
  if(q){ q.addEventListener('input', ()=>{ V.q=q.value; const p=window.scrollY; app.innerHTML=viewSearch(V.q);
      const n=$('#q'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } bindSearch(); window.scrollTo(0,p); }); }
}
function bindSearch(){ const q=$('#q'); if(!q) return;
  q.addEventListener('input', ()=>{ V.q=q.value; const p=window.scrollY; $('#app').innerHTML=viewSearch(V.q);
    const n=$('#q'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } bindSearch(); window.scrollTo(0,p); }); }

    +'<button class="btn g" data-act="close">取消</button>'
  );
  const t=$('#a-t'), cs=$('#a-c'), ps=$('#a-p'), g=$('#a-guess');

  t.addEventListener('input',()=>{
    const v=t.value.trim(); if(!v){ g.textContent=''; return; }
    if(picked){ g.textContent='分类你自己选了，我不改'; return; }
    const s=v.toLowerCase(); let best=null,sc=0;
    for(const k in KEYWORDS){ let n=0; KEYWORDS[k].forEach(w=>{ if(s.includes(w)) n+= w.length>3?2:1; }); if(n>sc){sc=n;best=k;} }

    else g.textContent='没猜出来，下面手动选一个';

/* ===================== 交互 ===================== */
function download(name,text,mime){
  const b=new Blob([text],{type:mime}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function csvText(){
  const rows=[['分类','阶段','事项','状态','关键','带法','金额','币种','说明','我的备注']];
  all().forEach(it=>{ const c=costOf(it), m=mark(it.id);
    rows.push([CATN[it.c]||'', (PH[it.p]||{}).code||'', it.t,
      m==='done'?'已完成':(m==='skip'?'不需要':'未完成'), it.k?'是':'',
      it.b==='cn'?'国内带':(it.b==='sg'?'落地买':''), c.a||'', c.a?c.cu:'',
      it.n||'', (S.note[it.id]||'')]); });
  return '﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
}

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-tog],[data-more],[data-cat],[data-ph],[data-tph],[data-go],[data-act],[data-st]');
  if(!t) return;
  const d=t.dataset;

  if(d.tog){ const id=d.tog; S.mark[id]= mark(id)==='done'?'todo':'done'; save(); refreshRow(id);
    if(V.v==='cat'&&V.todo){ setTimeout(()=>render(),260); } return; }
  if(d.more){ detailSheet(d.more); return; }
  if(d.cat){ go({v:'cat', c:d.cat, todo:false}); return; }
  if(d.ph!==undefined && d.ph!==''){ go({v:'todo', p:d.ph}); return; }
  if(d.tph!==undefined){ V.p=d.tph; $('#app').innerHTML=viewTodo(d.tph); window.scrollTo(0,0); return; }
  if(d.go){ if(d.go==='more') go({v:'more'}); else go({v:d.go}); if(d.go==='search') setTimeout(bindSearch,50); return; }
  if(d.st){ const id=$('#sheet').querySelector('[data-act="dsave"]').dataset.id;
    S.mark[id]=d.st; save();
    $('#sheet').querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.st===d.st)));
    refreshRow(id); return; }

  switch(d.act){
    case 'back': history.back(); break;
    case 'close': closeSheet(); break;
    case 'add': addSheet(); break;
    case 'onlytodo': V.todo=!V.todo; $('#app').innerHTML=viewCat(V.c,V.todo); window.scrollTo(0,0); break;
    case 'clearq': V.q=''; $('#app').innerHTML=viewSearch(''); bindSearch(); break;
    case 'setdate': {
      const v=prompt('出发日期（YYYY-MM-DD）\n所有阶段日期会跟着重算', S.settings.depart);
      if(v && /^\d{4}-\d{2}-\d{2}$/.test(v.trim())){ S.settings.depart=v.trim(); save(); render(); toast('已更新出发日'); }
      else if(v) toast('格式要像 2026-11-01');
      break; }
    case 'setrate': {
      const v=prompt('1 新加坡元 = 多少人民币？\n非实时汇率，自己核一下', String(S.settings.rate));
      const n=Number(v); if(n>0){ S.settings.rate=n; save(); render(); toast('已更新汇率'); }
      break; }
    case 'dsave': {
      const id=d.id;
      const n=$('#d-n').value.trim(), a=Number($('#d-a').value)||0, u=$('#d-u').value;
      S.note[id]=n; if(a) S.cost[id]={a:a,cu:u}; else delete S.cost[id];
      save(); closeSheet(); render(); toast('已保存'); break; }
    case 'ddel': {
      const id=d.id;
      if(!confirm('删掉这一条？')) break;
      S.custom=(S.custom||[]).filter(x=>x.id!==id);
      delete S.mark[id]; delete S.note[id]; delete S.cost[id];
      save(); closeSheet(); render(); toast('已删除'); break; }
    case 'asave': {
      const v=$('#a-t').value.trim(); if(!v){ $('#a-t').focus(); break; }
      const it={id:'u'+Date.now().toString(36), c:$('#a-c').value, t:v, n:'', p:$('#a-p').value, k:0, b:'', a:0, cu:'SGD', own:1};
      S.custom=(S.custom||[]); S.custom.push(it); save(); closeSheet();
      go({v:'cat', c:it.c, todo:false}); toast('已加到「'+CATN[it.c]+'」'); break; }
    case 'backup': download('NTU-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(S,null,1), 'application/json');
      toast('已导出，存到「文件」里'); break;
    case 'csv': download('NTU-checklist-'+new Date().toISOString().slice(0,10)+'.csv', csvText(), 'text/csv;charset=utf-8');
      toast('已导出 CSV'); break;
    case 'restore': $('#rf').click(); break;
  }
});
document.addEventListener('change', e=>{
  if(e.target.id!=='rf') return;
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{
      const d=JSON.parse(fr.result); if(!d||typeof d!=='object') throw 0;
      if(!confirm('会用备份覆盖当前进度，确定？')) return;
      S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), d);
      if(!S.settings) S.settings={depart:'2026-11-01',rate:5.4};
      save(); render(); toast('已恢复');
    }catch(err){ toast('读不出来，要选之前导出的 .json'); } };
  fr.readAsText(f); e.target.value='';
});

load();
go({v:'home'}, true);
</script>
</body>
</html>
